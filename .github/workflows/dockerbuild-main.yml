name: Docker Build Main

on:
  push:
    paths:
      - '.github/workflows/*'
      - 'Dockerfile'
      - 'entrypoint.sh'
    branches:
      - 'main'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build Multiarch Images
    runs-on: ubuntu-latest
    environment: env

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: GitHub Container Registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup image tags
        id: docker-metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            amitie10g/webmin-bind
            ghcr.io/amitie10g/webmin-bind
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ steps.docker-metadata.outputs.tags != '' }}
          push: true
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          cache-from: type=registry,ref=amitie10g/webmin-bind:latest-buildcache
          cache-to: type=registry,ref=amitie10g/webmin-bind:latest-buildcache,mode=max

      - name: Generate artifact attestation
        if: steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/amitie10g/webmin-bind
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          show-summary: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
